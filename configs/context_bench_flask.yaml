# Context-tool comparison, flask target.
#
# Six conditions answer the same frozen question set about the same pinned
# checkout (pallets/flask @ 258d68b6, staged out-of-tree) under one model,
# one prompt, and one blind judge. Every MCP-backed arm mounts a static,
# pre-flighted config via --strict-mcp-config; the system prompt is identical
# across arms except for one sentence naming which tools exist. Agents run in
# clean git worktrees so no arm can read another tool's on-disk artifacts.

experiment_name: "context_bench_flask"

benchmarks:
  swe_qa:
    enabled: true
    tasks_file:
      - data/context_bench/questions_flask.json
      - data/context_bench/questions_why.json
    repos:
      - "pallets/flask"
  swe_bench:
    enabled: false

conditions:
  - name: "C0_bare"
    repowise_enabled: false

  - name: "C1_repowise"
    repowise_enabled: true
    repowise_mode: "lean"      # --profile core: best schema-cost/behavior tradeoff on flask
    claude_md: false           # parity: no arm gets extra standing context
    clean_worktree: true

  - name: "C2_codegraph"
    mcp_server:
      prefix: "codegraph"
      config: "mcp_configs/codegraph_flask.json"
    clean_worktree: true

  - name: "C3_serena"
    mcp_server:
      prefix: "serena"
      config: "mcp_configs/serena_flask.json"
    clean_worktree: true

  - name: "C4_repomix"
    repowise_enabled: false
    worktree_variant: "repomix"
    worktree_files:
      "repomix-output.xml": "data/context_bench/repomix_packs/pallets_flask/default.xml"
    system_note: "The file repomix-output.xml in the repository root contains a packed XML representation of the whole repository."

  - name: "C5_deepwiki"
    mcp_server:
      prefix: "deepwiki"
      config: "mcp_configs/deepwiki_flask.json"
    clean_worktree: true
    system_note: "The deepwiki MCP tools serve the public repository pallets/flask."

agent:
  model: "sonnet"
  max_turns: 15
  timeout_seconds: 300

repowise:
  binary: "repowise"
  index_dir: "./indexes"
  doc_model: "gpt-5.4-nano"
  provider: "openai"
  embedder: "openai"
  assume_indexed: true         # the staged checkout carries the pinned index

paths:
  results_dir: "./results/context_bench/track1_flask"
  repos_dir: "./repos"
  logs_dir: "./logs/context_bench_flask"
  repo_overrides:
    "pallets/flask": "~/bench-staging/pallets_flask"

budget:
  max_total_usd: 30.0
  max_per_task_usd: 1.5
  abort_on_exceed: true

evaluation:
  judge_model: "sonnet"
  dimensions: ["correctness", "completeness", "relevance", "clarity", "reasoning"]

parallelism:
  max_workers: 3

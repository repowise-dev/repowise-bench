# Context-tool comparison, fastify target (TypeScript/JS).
#
# Same protocol as context_bench_flask.yaml against fastify/fastify pinned at
# v5.10.0 (94bcbcc6), staged out-of-tree. fastify exists in the matrix so the
# comparison also runs on a repo whose language favors the graph/LSP tools.

experiment_name: "context_bench_fastify"

benchmarks:
  swe_qa:
    enabled: true
    tasks_file:
      - data/context_bench/questions_fastify.json
      - data/context_bench/questions_why.json
    repos:
      - "fastify/fastify"
  swe_bench:
    enabled: false

conditions:
  - name: "C0_bare"
    repowise_enabled: false

  - name: "C1_repowise"
    repowise_enabled: true
    repowise_mode: "lean"
    claude_md: false
    clean_worktree: true

  - name: "C2_codegraph"
    mcp_server:
      prefix: "codegraph"
      config: "mcp_configs/codegraph_fastify.json"
    clean_worktree: true

  - name: "C3_serena"
    mcp_server:
      prefix: "serena"
      config: "mcp_configs/serena_fastify.json"
    clean_worktree: true

  - name: "C4_repomix"
    repowise_enabled: false
    worktree_variant: "repomix"
    worktree_files:
      "repomix-output.xml": "data/context_bench/repomix_packs/fastify_fastify/default.xml"
    system_note: "The file repomix-output.xml in the repository root contains a packed XML representation of the whole repository."

  - name: "C5_deepwiki"
    mcp_server:
      prefix: "deepwiki"
      config: "mcp_configs/deepwiki_fastify.json"
    clean_worktree: true
    system_note: "The deepwiki MCP tools serve the public repository fastify/fastify."

agent:
  model: "sonnet"
  max_turns: 15
  timeout_seconds: 300

repowise:
  binary: "repowise"
  index_dir: "./indexes"
  doc_model: "gpt-5.4-nano"
  provider: "openai"
  embedder: "openai"
  assume_indexed: true

paths:
  results_dir: "./results/context_bench/track1_fastify"
  repos_dir: "./repos"
  logs_dir: "./logs/context_bench_fastify"
  repo_overrides:
    "fastify/fastify": "~/bench-staging/fastify_fastify"

budget:
  max_total_usd: 35.0
  max_per_task_usd: 1.5
  abort_on_exceed: true

evaluation:
  judge_model: "sonnet"
  dimensions: ["correctness", "completeness", "relevance", "clarity", "reasoning"]

parallelism:
  max_workers: 3

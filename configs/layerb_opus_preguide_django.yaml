# ENFORCED TOOL USE UNDER CLAUDE CODE. 6 arms x 15 questions = 90 cells.
#
# Pre-registration: configs/layerb_opus_preguide.PREREGISTRATION.md.
# Gate that must pass first: configs/layerb_opus_preguide_gate_django.yaml.
#
# THE QUESTION. Finding E13: under Claude Code the tool under test is mostly
# not called, so a token comparison there mostly compares two bare agents. On
# the paired Opus baseline repowise adopted 7 of 15 and three competitors
# adopted 0 of 15, while Codex called every tool on every question. So Codex
# has an answer to "do these tools save tokens when used" and Claude Code has
# never had one. This buys it, by making usage a CONDITION of the run.
#
# This config is `layerb_opus_stratified_django.yaml` with one key changed and
# nothing else of substance. A hostile key-by-key diff should return exactly:
#
#   force_tool_use          absent -> "pre-guide"     THE VARIABLE
#   experiment_name         renamed
#   paths.results_dir       renamed (resume is on (task_id, condition))
#   paths.logs_dir          renamed
#   budget.max_total_usd    60.0 -> 45.0, a spend rail, not a knob the run reads
#
# Same 15 stratified questions, same seed, same model, same max_turns, same
# neutral prompt, same judge, same six arms.
#
# THE MECHANISM is the harness's own PreToolUse hook on Read|Grep|Glob,
# attached identically to every MCP arm with only that arm's server prefix and
# tool names substituted, injecting additionalContext and never denying the
# read, silent once that server has been called, capped at 3 nudges. Two
# alternatives were measured and rejected first: a prompt mandate reached 2 of
# 6 and changed the outcome on no cell, and a Stop block reached 4 of 4 at +61%
# and +127% output tokens because it discards a finished answer. See the
# pre-registration section 1.
#
# ADOPTION IS NOT AN OUTCOME HERE, by construction. It is already answered and
# published. Every row stamps force_tool_use, and no table may pool a nudged
# cell with an unnudged one, in either direction.
#
# `c0-bare` CANNOT BE NUDGED and is left unmatched and declared, not papered
# over with an invented sham condition. The versus-bare column therefore
# carries the nudge's cost on the treated side only, which is CONSERVATIVE
# against every tool including ours. Pre-registration section 3 fixes what
# happens if that turns out not to be small.
#
# SERENA RUNS 11 ALLOWLISTED TOOLS HERE AND RAN 10 IN THE BASELINE
# (execute_shell_command was restored after that run). No table pools those two
# rows.
#
# NO --effort FLAG, matching every run this is read against.
#
# Run:
#   $env:REPOWISE_ROOT = "C:/Users/ragha/Desktop/repowise-layerb2"
#   $env:REPOWISE_EXE  = "C:/Users/ragha/Desktop/repowise-layerb2/.venv/Scripts/repowise.exe"
#   $env:FORCE_PROMPT_CACHING_5M = "1"
#   python harness/run_experiment.py --config configs/layerb_opus_preguide_django.yaml

experiment_name: "layerb_opus_preguide_django"

arms_file: null
arms_dir: null
prompt_style: "neutral"

# THE VARIABLE.
force_tool_use: "pre-guide"

benchmarks:
  swe_qa:
    enabled: true
    repos:
      - "django/django"
    # Computed, not listed, so the draw follows the classification. Resolves to
    # the same 15 ids every django Layer B run has used:
    #   django_000 004 006 008 011 014 017 020 028 031 033 034 040 044 045
    stratified_shapes:
      per_shape: 3
      seed: 20260803
  swe_bench:
    enabled: false
  fea_bench:
    enabled: false

conditions:
  - name: "c0-bare"
    arm: "c0-bare"
  - name: "repowise"
    arm: "repowise"
  - name: "codegraph"
    arm: "codegraph"
  - name: "graphify"
    arm: "graphify"
  - name: "serena"
    arm: "serena"
  - name: "code-review-graph"
    arm: "code-review-graph"

agent:
  harness: "claude_code"
  model: "claude-opus-5"
  max_turns: 15
  timeout_seconds: 900

repowise:
  binary: "repowise"
  index_dir: "./indexes"
  provider: "openai"
  doc_model: "gpt-5.4-nano"
  embedder: "openai"

paths:
  results_dir: "./results/bakeoff_2026_08/rung6/layerb_opus_preguide_django"
  repos_dir: "./repos"
  logs_dir: "./logs/layerb_opus_preguide_django"
  trees_dir: null

budget:
  # The paired baseline ran these 90 cells for $28.57. The four smokes averaged
  # $0.31/cell. The rail is ~1.5x the projection: high enough that nudged cells
  # cannot trip it, low enough to stop a runaway.
  max_total_usd: 45.0
  max_per_task_usd: 3.0
  abort_on_exceed: true

evaluation:
  judge_model: "gpt-5.6-luna"
  dimensions: ["correctness", "completeness", "relevance", "clarity", "reasoning"]

parallelism:
  # Finding E1, and the nudge counter is keyed per session so parallelism would
  # not corrupt it. Kept at 1 to match every run this is read against.
  max_workers: 1

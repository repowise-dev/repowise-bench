    test_command: >-
      C:\Users\ragha\Desktop\bakeoff\hermes-venv\Scripts\python.exe -m pytest tests/agent/test_gemini_native_adapter.py -q
    prompt: >-
      Issue #83869: when Gemini returns MALFORMED_FUNCTION_CALL, the adapter
      maps it through a catch-all so the turn is recorded with the same
      finish_reason as a clean completion and lands in the successful
      trajectory file. Fix it. The test suite must still pass.

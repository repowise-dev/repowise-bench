  - id: B07
    kind: edit
    source_issue: 84289
    # Replaces the design's #83792, which was NOT authored: the test that issue
    # ships deliberately asserts the CURRENT (undesired) behaviour, so it is a
    # characterisation test rather than an oracle, and a correct fix is
    # under-specified.
    verified: >-
      Proved in both directions 2026-08-12 with three negative controls. TWO
      independent sites carry the same four lines (the local path in
      execute_code and the remote path in _execute_remote), and the half-fix NC

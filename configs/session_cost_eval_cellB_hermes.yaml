    oracle:
      kind: probe_and_suite
      probe: scripts/oracles/hermes_83807_process_wait_timeout_unit.py
      suite_scope: tests/tools/test_process_wait_clarity.py   # >= 5 passed, 0 failed
      description: >-
        A model-supplied timeout must not render as a bare elapsed-looking
        duration. Pinning either exact replacement string would fail the other
        acceptable fix.
    test_command: >-
      C:\Users\ragha\Desktop\bakeoff\hermes-venv\Scripts\python.exe -m pytest tests/tools/test_process_wait_clarity.py -q
    prompt: >-
      Issue #83807: the `process wait` tool row renders a model-supplied

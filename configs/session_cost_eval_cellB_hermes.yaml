      repro step 3 is WRONG -- it calls `enabled_tools=["web_search"]` a
      non-sandbox list, but web_search IS in SANDBOX_ALLOWED_TOOLS, so that
      case is already correct and an oracle following the body would fail a
      correct fix.
    oracle:
      kind: probe_and_suite
      probe: scripts/oracles/hermes_84289_sandbox_tool_gating.py
      suite_scope: tests/tools/test_code_execution_modes.py   # >= 12 passed, 9 skipped, 0 failed
      description: >-
        An explicit restriction must be respected on BOTH execute paths, and
        `enabled_tools=None` must still trigger the legacy full-access
        fallback. Deleting the fallback makes the first half pass and breaks
        every existing caller.
    test_command: >-
      C:\Users\ragha\Desktop\bakeoff\hermes-venv\Scripts\python.exe -m pytest tests/tools/test_code_execution_modes.py -q
    prompt: >-
      Issue #84289: execute_code treats an explicit empty tool restriction as
      missing configuration, so `enabled_tools=[]` exposes the full set of
      sandbox helper tools instead of none. Only `enabled_tools is None` should
      fall back to granting everything. Fix it. The test suite must still pass.

  # -------------------------------------------------------------------------
  # SESSION C3
  # -------------------------------------------------------------------------

  - id: B08
    kind: architecture
    source_issue: null
    oracle: none
    test_command: none
    prompt: >-
      Explain how a conversation's message history is persisted and restored in

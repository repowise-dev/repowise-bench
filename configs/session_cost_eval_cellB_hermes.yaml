    oracle:
      kind: probe_and_suite
      probe: scripts/oracles/hermes_83869_gemini_malformed_finish.py
      suite_scope: tests/agent/test_gemini_native_adapter.py   # >= 9 passed, 0 failed
      description: >-
        A provider-side MALFORMED_FUNCTION_CALL must not be reported with the

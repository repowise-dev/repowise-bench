    verified: >-
      Proved in both directions with negative controls. NC2 matters most: a
      "fix" that simply stops probing /health/detailed genuinely removes the
      401s by removing the feature, and an oracle checking only "no more 401"
      would have called that a fix.
    oracle:
      kind: probe_and_suite
      probe: scripts/oracles/hermes_83131_health_probe_auth.py
      suite_scope: tests/hermes_cli/test_web_server.py+test_gateway_runtime_health.py
      description: >-
        The /health/detailed probe must carry Bearer API_SERVER_KEY, and
        dropping the detailed probe entirely must NOT count as a fix.
    test_command: >-
      C:\Users\ragha\Desktop\bakeoff\hermes-venv\Scripts\python.exe -m pytest tests/hermes_cli/test_web_server.py tests/hermes_cli/test_gateway_runtime_health.py -q
    prompt: >-
      Issue #83131: the dashboard's gateway health probe requests
      /health/detailed without an Authorization header, so every call is
      rejected with 401 and the code silently falls back to the
      unauthenticated /health route. Send the configured API server key on the
      detailed probe. The test suite must still pass.

  # -------------------------------------------------------------------------
  # SESSION C2
  # -------------------------------------------------------------------------

  - id: B05
    kind: retrieval
    source_issue: 83422
    oracle: none
    test_command: none
    prompt: >-
      Issue #83422 reports that `hermes teams-pipeline fetch --join-web-url`

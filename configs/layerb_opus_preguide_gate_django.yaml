# THE GATE for the enforced-tool-use run. 3 arms x 1 question = 3 cells.
#
# Pre-registration: configs/layerb_opus_preguide.PREREGISTRATION.md.
#
# ONLY the three arms the mechanism has never touched. `repowise` and
# `codegraph` were smoked on 6 cells already and are not re-bought here.
# graphify, serena and code-review-graph have never had a pre-guide hook, and
# prediction P2 says at least one of them will need a fix its README would not
# have predicted, because every arm that has ever had a first cell in this
# workstream did.
#
# django_017 because it is the cell that RELIABLY triggers nudges: on both
# smoked arms the agent reached for Grep before its server and took all 3.
# A gate on a cell that never nudges would prove nothing about the mechanism.
#
# Assertions, per arm, on every non-error cell:
#   * the arm's server is called (arm_exercised true)
#   * hook_injections name that arm's OWN prefix, never another's
#   * mcp_isError_count == 0, so a dead server is not read as a nudge failure
#
# An arm that fails is fixed and re-gated, or declared UNRUNNABLE in the
# pre-registration with the failure quoted, before the 90 spend anything. An
# arm declared unrunnable is reported as unrunnable and never as a zero.

experiment_name: "layerb_opus_preguide_gate_django"

arms_file: null
arms_dir: null
prompt_style: "neutral"
force_tool_use: "pre-guide"

benchmarks:
  swe_qa:
    enabled: true
    repos:
      - "django/django"
    task_ids:
      - "django_017"
  swe_bench:
    enabled: false
  fea_bench:
    enabled: false

conditions:
  - name: "graphify"
    arm: "graphify"
  - name: "serena"
    arm: "serena"
  - name: "code-review-graph"
    arm: "code-review-graph"

agent:
  harness: "claude_code"
  model: "claude-opus-5"
  max_turns: 15
  timeout_seconds: 900

repowise:
  binary: "repowise"
  index_dir: "./indexes"
  provider: "openai"
  doc_model: "gpt-5.4-nano"
  embedder: "openai"

paths:
  results_dir: "./results/bakeoff_2026_08/rung6/layerb_opus_preguide_gate_django"
  repos_dir: "./repos"
  logs_dir: "./logs/layerb_opus_preguide_gate_django"
  trees_dir: null

budget:
  max_total_usd: 6.0
  max_per_task_usd: 3.0
  abort_on_exceed: true

evaluation:
  judge_model: "gpt-5.6-luna"
  dimensions: ["correctness", "completeness", "relevance", "clarity", "reasoning"]

parallelism:
  max_workers: 1

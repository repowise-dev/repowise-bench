# SMOKE ONLY. Not a result, and never a row in anything.
#
# Two of the fifteen ids the real draw resolves to, run through the full runner
# so the integration is exercised end to end (index check, arm resolution,
# opencode CLI, judge, result writing) before 45 cells are committed.
#
# `task_ids` is used INSTEAD of `stratified_shapes` because the two are mutually
# exclusive by design: a hand-written list silently overriding a computed draw
# is how a stratified run stops being one. That also means THIS FILE IS NOT THE
# EXPERIMENT. `layerb_local8b_stratified_django.yaml` keeps the byte-identical
# `stratified_shapes` block the Opus and Codex configs carry, and it is the only
# file the real run may use.
#
# django_020 is deliberately one of the two: it is the workstream's worked
# example, where the agent called one tool, read no files, stopped early and
# lost 1.6 judge points to a control that read a single file.

experiment_name: "layerb_local8b_stratified_django_SMOKE"

benchmarks:
  swe_qa:
    enabled: true
    repos:
      - "django/django"
    task_ids:
      - "django_000"
      - "django_020"
  swe_bench:
    enabled: false
  fea_bench:
    enabled: false

conditions:
  - name: "C0_bare"
    repowise_enabled: false
    repowise_mode: null
    claude_md: false
    plugin_skills: false

  - name: "C2_repowise"
    repowise_enabled: true
    repowise_mode: "full"
    claude_md: false
    plugin_skills: false

  - name: "C2_repowise_local"
    repowise_enabled: true
    repowise_mode: "full"
    claude_md: false
    plugin_skills: false
    allowed_tools:
      - "search_codebase"
      - "get_context"
      - "get_symbol"

agent:
  harness: "opencode"
  model: "ollama/qwen3:8b-16k"
  max_turns: 15
  timeout_seconds: 900

parallelism:
  max_workers: 1

repowise:
  binary: "repowise"
  index_dir: "./indexes"
  provider: "openai"
  doc_model: "gpt-5.4-nano"
  embedder: "openai"

paths:
  results_dir: "./results/bakeoff_2026_08/layerb_local8b_stratified_django_SMOKE"
  repos_dir: "./repos"
  logs_dir: "./logs/layerb_local8b_stratified_django_SMOKE"

budget:
  max_total_usd: 2.0
  max_per_task_usd: 1.0
  abort_on_exceed: true

evaluation:
  judge_model: "gpt-5.6-luna"
